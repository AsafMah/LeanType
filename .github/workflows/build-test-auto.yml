name: Unit tests
# Compiles main + runs the JVM unit-test suite for the offline flavor using the `runTests`
# build type, which self-skips the network/data-dependent tests known to fail on CI
# (see `if (BuildConfig.BUILD_TYPE == "runTests") return` in XLinkTest/StringUtilsTest/
# InputLogicTest/KeyboardParserTest; tracked in issue #12). Hard gate: a real test failure
# fails the job. No APK is produced; single-ABI, JVM tests only.

on:
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build-test-auto.yml'
  push:
    branches: [ dev ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record run start time
        id: start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew :app:testOfflineRunTestsUnitTest --continue

      # Authoritative gate. Strictly stronger than the Gradle exit code above:
      # it also fails on results that are stale (task was UP-TO-DATE, so the
      # report describes code that never ran) or self-inconsistent (enumerated
      # testcases disagree with the totals the suites declare). Both of those
      # have previously produced confident, wrong "it passes" conclusions.
      - name: Verify test results and diff against baseline
        run: |
          python3 tools/check_test_results.py \
            --results-dir app/build/test-results/testOfflineRunTestsUnitTest \
            --baseline tools/test_baselines/runTests-linux.txt \
            --started-after ${{ steps.start.outputs.ts }}

      - name: Self-test the results checker
        if: ${{ always() }}
        run: python3 -m unittest discover -s tools/tests

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports'
        if: ${{ always() }}
